<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion — Back-office Le 119</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/bo/css/bo.css">
</head>
<body class="bo-login-body">

<main class="bo-login">
  <div class="bo-login-card">
    <p class="bo-eyebrow">Le 119</p>
    <h1>Back-office</h1>

    <form id="login-form" novalidate>
      <div class="bo-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <div class="bo-field">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>

      <p class="bo-error" id="login-error" role="alert" hidden></p>

      <button type="submit" class="bo-btn bo-btn-accent bo-btn-full">Se connecter</button>
    </form>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/bo/js/supabase-client.js"></script>
<script src="/bo/js/login.js"></script>
</body>
</html>
